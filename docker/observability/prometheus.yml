global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: beecrm-api
    metrics_path: /api/metrics
    static_configs:
      # api:3000 → API dentro de Docker · host.docker.internal:3000 → API corriendo en el host (pnpm dev)
      - targets: ['api:3000', 'host.docker.internal:3000']
